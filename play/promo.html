<!DOCTYPE html>

<meta charset="utf-8">
<title>AR Geodet — propagační obrázky do Google Play</title>

<!--
  ===== PROPAGAČNÍ OBRÁZKY PRO GOOGLE PLAY =====================================
  Tahle stránka NENÍ součást appky. Je to PŘEDLOHA, ze které skript
  `scripts/gen_promo.py` vyrenderuje hotové PNG v přesných rozměrech obchodu:

      play/promo/feature.png     1024 ×  500   „feature graphic" (povinný banner)
      play/promo/play-1..4.png   1080 × 1920   screenshoty telefonu

  ⚠⚠ ŽÁDNÉ MÍSTO NA FOTKU. Panely jsou SAMY O SOBĚ HOTOVÉ — informační leták
  propagačním způsobem, který říká, co appka umí, a nečeká na nic dalšího.

  ⚠⚠ ČTYŘI PANELY, JEN PRO ANDROID (přání 31. 8. 2026: „udělej jich méně, jen
  pro Android, a na každou fotku klidně více věcí"). Osm panelů po jedné
  vlastnosti nikdo v obchodě nedolistuje; čtyři hutné projde. Každý proto
  spojuje CELOU OBLAST. Varianta pro App Store (ios-*.png, 1290 × 2796) je
  pryč — kdyby se vracela, stačí do `TYPY` níž přidat `ios` a do CSS
  `.panel.ios`; layout je v jednotkách --u (1 % šířky), takže se přizpůsobí
  sám. Staré ios-*.png by se pak musely smazat ručně (generátor maže jen to,
  co zrovna vyrábí).

  ⚠⚠ SCÉNA JE TELEFON, NE PLOVOUCÍ KRESBA (přání 31. 8. 2026: „dokážeš je
  vylepšit, aby byly více profesionální"). Do té doby ležely kresby volně na
  pozadí a panel působil jako infografika, ne jako appka. Teď má každý panel
  TELEFON s obrazovkou (uvnitř výjev z té oblasti) a k němu DVĚ VYZDVIŽENÉ
  KARTY, které přesahují jeho okraj a nesou další fakt. Tím se do panelu vejde
  víc věcí, aniž by se obrazovka ucpala — a je na první pohled poznat, že jde
  o mobilní appku. Přesně tak vypadají listingy, se kterými appka v obchodě
  soupeří.

  ⚠ PÍSMA JSOU FIREMNÍ, ne systémová. Sora (nadpisy), Inter (text) a JetBrains
  Mono (čísla) jsou tytéž řezy, které používá samotná appka, a berou se z
  `css/fonts.css` v repu — ne z internetu, takže render funguje i offline.
  Čísla V CELÉ PŘEDLOZE patří do mono řezu: souřadnice, vzdálenosti a odchylky
  pak stojí pod sebou jako na měřickém přístroji, ne jako v letáku.

  ⚠ Popisky ve scénách (čísla parcel, vzdálenosti, souřadnice, výměry) jsou
  VYMYŠLENÉ, ale realistické — jsou to ukázky, ne data. Kdyby se měnily, musí
  zůstat věrohodné pro geodeta: parcelní čísla ve tvaru 421/7, metry
  s desetinnou ČÁRKOU, souřadnice v S-JTSK (sedm míst před čárkou).

  Rozměry sedí až z generátoru (ten každý panel vyfotí zvlášť a přesně na
  pixel); ručně v prohlížeči jde stránka jen prohlédnout.
  =============================================================================
-->
<link rel="stylesheet" href="../css/fonts.css">
<style>
    :root {
        --bg0: #1b212a;
        --bg1: #0a0e13;
        --accent: #2f9e74;
        --accent-bright: #3eb487;
        --accent-soft: rgba(47, 158, 116, 0.14);
        --accent-line: rgba(47, 158, 116, 0.42);
        --text: #eceef2;
        --muted: #98a0ab;
        --gold: #e6bd76;
        --font-nadpis: "Sora", "Inter", system-ui, sans-serif;
        --font-text: "Inter", system-ui, -apple-system, sans-serif;
        --font-cisla: "JetBrains Mono", ui-monospace, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        background: #05070a;
        font-family: var(--font-text);
        color: var(--text);
        padding: 40px;
        display: flex;
        flex-wrap: wrap;
        gap: 40px;
        align-items: flex-start;
    }

    /* ---- panel obchodu ---------------------------------------------------
       Všechno uvnitř je v jednotce --u (1 % šířky), ne v pixelech. Kdyby se
       vracela druhá velikost (App Store), stačí přidat třídu s jiným --w/--h
       a layout se přizpůsobí sám. */
    .panel {
        width: var(--w);
        height: var(--h);
        --u: calc(var(--w) / 100);
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        background: linear-gradient(168deg, var(--bg0) 0%, var(--bg1) 62%, #070a0e 100%);
        flex: 0 0 auto;
    }
    .panel.play { --w: 1080px; --h: 1920px; }

    /* Dvě vrstvy pozadí: jemná síť („geodetický papír") a nad ní světlo zhora,
       aby panel nebyl plochá deska. Vinětace dole potlačí spodní roh, kde
       stojí patička — text na ní pak drží kontrast. */
    .panel::before {
        content: "";
        position: absolute; inset: 0;
        background-image:
            linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: calc(var(--u) * 8) calc(var(--u) * 8);
        -webkit-mask-image: radial-gradient(115% 75% at 50% 30%, #000 0%, transparent 78%);
        mask-image: radial-gradient(115% 75% at 50% 30%, #000 0%, transparent 78%);
        pointer-events: none;
    }
    .panel::after {
        content: "";
        position: absolute; inset: 0;
        background:
            radial-gradient(78% 42% at 50% 0%, rgba(62, 180, 135, 0.20) 0%, rgba(62, 180, 135, 0) 68%),
            radial-gradient(120% 60% at 50% 108%, rgba(0, 0, 0, 0.55) 0%, rgba(0, 0, 0, 0) 62%);
        pointer-events: none;
    }

    /* ---- hlavička --------------------------------------------------------- */
    .head {
        position: relative;
        z-index: 1;
        padding: calc(var(--u) * 7.5) calc(var(--u) * 7) 0;
        flex: 0 0 auto;
    }
    .kicker {
        display: inline-flex;
        align-items: center;
        gap: calc(var(--u) * 1.5);
        padding: calc(var(--u) * 1.15) calc(var(--u) * 2.6);
        border-radius: 999px;
        border: 1px solid var(--accent-line);
        background: var(--accent-soft);
        color: var(--accent-bright);
        font-family: var(--font-cisla);
        font-size: calc(var(--u) * 2.15);
        font-weight: 600;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        margin-bottom: calc(var(--u) * 3.2);
    }
    .kicker svg { width: calc(var(--u) * 2.8); height: calc(var(--u) * 2.8); }
    h1 {
        font-family: var(--font-nadpis);
        font-size: calc(var(--u) * 6.5);
        line-height: 1.08;
        font-weight: 800;
        letter-spacing: -0.028em;
        text-wrap: balance;
    }
    h1 em { color: var(--accent-bright); font-style: normal; }
    .sub {
        margin-top: calc(var(--u) * 2.1);
        font-size: calc(var(--u) * 2.95);
        line-height: 1.42;
        color: var(--muted);
        max-width: 93%;
    }

    /* ---- scéna: telefon + vyzdvižené karty -------------------------------- */
    .art {
        position: relative;
        z-index: 1;
        flex: 1 1 auto;
        min-height: 0;
        margin: calc(var(--u) * 3.5) calc(var(--u) * 5) calc(var(--u) * 2.5);
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .art svg { width: 100%; height: 100%; overflow: visible; }

    /* společná řeč čar */
    .art .lin { fill: none; stroke: var(--accent-bright); stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; }
    .art .lin-tenka { fill: none; stroke: rgba(255, 255, 255, 0.26); stroke-width: 0.6; stroke-linecap: round; stroke-linejoin: round; }
    .art .lin-prerus { fill: none; stroke: rgba(255, 255, 255, 0.30); stroke-width: 0.6; stroke-dasharray: 1.8 1.5; stroke-linecap: round; }
    .art .plocha { fill: rgba(47, 158, 116, 0.14); stroke: var(--accent-bright); stroke-width: 0.85; stroke-linejoin: round; }
    .art .terc { fill: var(--accent-bright); }
    .art .zlata { fill: var(--gold); }

    /* tělo telefonu a jeho obrazovka */
    .art .telo { fill: #0b0f14; stroke: rgba(255, 255, 255, 0.26); stroke-width: 0.9; }
    .art .obrazovka { fill: #0d1218; }
    .art .sluchatko { fill: rgba(255, 255, 255, 0.16); }
    /* prvek rozhraní uvnitř obrazovky */
    .art .ui { fill: rgba(255, 255, 255, 0.06); stroke: rgba(255, 255, 255, 0.14); stroke-width: 0.5; }
    /* vyzdvižená karta, která přesahuje okraj telefonu */
    .art .vyzdvih { fill: #141a21; stroke: rgba(255, 255, 255, 0.20); stroke-width: 0.7; }

    .art text { font-family: var(--font-text); }
    .art .t-nadpis { fill: var(--text); font-size: 2.6px; font-weight: 700; }
    .art .t-drobne { fill: var(--muted); font-size: 2.05px; font-weight: 500; }
    .art .t-stitek {
        fill: var(--muted); font-size: 1.95px; font-weight: 600;
        letter-spacing: 0.11em; font-family: var(--font-cisla);
    }
    /* ⚠ ČÍSLA VŽDY MONO. Souřadnice, vzdálenosti i odchylky pak stojí pod sebou
       jako na přístroji — v proporcionálním řezu se sloupce rozjížděly. */
    .art .t-cislo { fill: var(--gold); font-size: 2.5px; font-weight: 600; font-family: var(--font-cisla); }
    .art .t-velke { fill: var(--text); font-size: 4.6px; font-weight: 700; font-family: var(--font-cisla); letter-spacing: -0.02em; }
    .art .t-akcent { fill: var(--accent-bright); font-size: 2.5px; font-weight: 600; font-family: var(--font-cisla); }
    /* ⚠⚠ DVA ÚDAJE V JEDNÉ PILULCE PATŘÍ DO JEDNOHO <text> S <tspan>, ne do dvou
       textů s ručně spočítaným x. Ručně to nešlo trefit: „4001" a „27,4 m" se
       slily v „400127,4 m", protože skutečná šířka řezu se od odhadu liší —
       a dvě čísla vedle sebe bez oddělovače se stejně čtou jako jedno. Takhle
       o rozestup i o tečku mezi nimi účtuje prohlížeč. */
    .art .cs-sep { fill: var(--muted); opacity: 0.55; }

    /* ---- výhody ----------------------------------------------------------- */
    .vyhody {
        position: relative;
        z-index: 1;
        flex: 0 0 auto;
        padding: 0 calc(var(--u) * 7);
        display: flex;
        flex-direction: column;
        gap: calc(var(--u) * 1.75);
    }
    .vyhody div {
        display: flex;
        align-items: flex-start;
        gap: calc(var(--u) * 1.9);
        font-size: calc(var(--u) * 2.8);
        line-height: 1.32;
        color: var(--text);
    }
    .vyhody svg {
        width: calc(var(--u) * 3.1);
        height: calc(var(--u) * 3.1);
        flex: 0 0 auto;
        margin-top: calc(var(--u) * 0.3);
        color: var(--accent-bright);
    }

    /* ---- patička ---------------------------------------------------------- */
    .foot {
        position: relative;
        z-index: 1;
        flex: 0 0 auto;
        margin: calc(var(--u) * 4.5) calc(var(--u) * 7) 0;
        padding: calc(var(--u) * 4) 0 calc(var(--u) * 5.5);
        border-top: 1px solid rgba(255, 255, 255, 0.09);
        display: flex;
        align-items: center;
        gap: calc(var(--u) * 2.2);
    }
    .foot .ico { width: calc(var(--u) * 6.2); height: calc(var(--u) * 6.2); flex: 0 0 auto; }
    .foot .nm { font-family: var(--font-nadpis); font-size: calc(var(--u) * 3.5); font-weight: 800; letter-spacing: -0.02em; }
    .foot .nm span { color: var(--accent-bright); }
    .foot .cl {
        margin-left: auto; text-align: right;
        font-family: var(--font-cisla);
        font-size: calc(var(--u) * 2.15);
        letter-spacing: 0.09em;
        text-transform: uppercase;
        line-height: 1.5;
        color: var(--muted);
    }

    /* ---- feature graphic 1024x500 --------------------------------------- */
    .feature {
        width: 1024px; height: 500px;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        gap: 46px;
        padding: 0 66px;
        background: linear-gradient(118deg, var(--bg0) 0%, var(--bg1) 70%, #070a0e 100%);
        flex: 0 0 auto;
    }
    .feature::before {
        content: "";
        position: absolute; inset: 0;
        background-image:
            linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        background-size: 40px 40px;
        -webkit-mask-image: radial-gradient(90% 120% at 16% 50%, #000 0%, transparent 82%);
        mask-image: radial-gradient(90% 120% at 16% 50%, #000 0%, transparent 82%);
    }
    .feature::after {
        content: "";
        position: absolute; inset: 0;
        background: radial-gradient(58% 120% at 14% 50%, rgba(62, 180, 135, 0.24) 0%, rgba(62, 180, 135, 0) 70%);
    }
    .feature .ico { width: 172px; height: 172px; flex: 0 0 auto; position: relative; z-index: 1; }
    .feature .tx { position: relative; z-index: 1; }
    .feature h2 { font-family: var(--font-nadpis); font-size: 64px; font-weight: 800; letter-spacing: -0.032em; line-height: 1.02; }
    .feature h2 span { color: var(--accent-bright); }
    .feature p { margin-top: 16px; font-size: 24.5px; line-height: 1.42; color: var(--muted); max-width: 620px; }
    .feature .chips { margin-top: 24px; display: flex; gap: 10px; flex-wrap: wrap; }
    .feature .chips b {
        font-family: var(--font-cisla);
        font-size: 17px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase;
        padding: 8px 16px; border-radius: 999px;
        border: 1px solid var(--accent-line); background: var(--accent-soft); color: var(--accent-bright);
    }

    /* popisek nad každým panelem — do PNG se nedostane, je jen pro prohlížení */
    .stitek { width: 100%; font-size: 15px; color: #8b93a1; font-family: var(--font-cisla); }
</style>

<script>
(function () {
    'use strict';
    var TYPY = ['play'];      // ⚠ App Store (ios) je pryč — viz hlavička souboru
    var data = JSON.parse(document.getElementById('panely').textContent);
    var IKONA = document.querySelector('.feature .ico svg').outerHTML.replace(/fg-em/g, 'ft-em');
    var SIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="6"/></svg>';
    var FAJFKA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.2 5.2L20 6.5"/></svg>';

    // ==================================================================
    // GEOMETRIE SCÉNY — jedno místo, odkud se počítá všechno ostatní.
    // Soustava 0 0 110 112 (poměr 0,98) odpovídá tvaru volného místa mezi
    // podnadpisem a výhodami, takže se scéna vejde bez letterboxu.
    // ==================================================================
    var T = { x: 31, y: 4, w: 48, h: 104, r: 7.5 };            // tělo telefonu
    var O = { x: T.x + 2.6, y: T.y + 2.6, w: T.w - 5.2, h: T.h - 5.2, r: 5.5 };  // obrazovka

    // Obsah obrazovky se píše v JEJÍCH SOUŘADNICÍCH (0,0 = levý horní roh
    // obrazovky) a tahle obálka ho posune na místo. Bez toho by se každé
    // číslo muselo ručně přičítat k O.x / O.y a při posunu telefonu by se
    // přepisovala celá scéna.
    function displej(vnitrek) {
        // ⚠ OŘEZ TVAREM OBRAZOVKY. Bez něj čtvercové výplně (obloha, mapa)
        //    přetekly přes zaoblené rohy a telefon vypadal, jako by měl
        //    obrazovku nalepenou přes rám.
        return '<g clip-path="url(#displej)" transform="translate(' + O.x + ' ' + O.y + ')">' + vnitrek + '</g>';
    }

    // Rám telefonu: záře pod ním, tělo, obrazovka, sluchátko. Záře je
    // radiální přechod, ne filtr — filtry v Chromiu při screenshotu občas
    // vyjdou zrnitě a tady jde o čistou plochu.
    function telefon(vnitrek) {
        return '' +

            '<rect class="sluchatko" x="' + (T.x + T.w / 2 - 4) + '" y="' + (T.y + 3.6) + '" width="8" height="1.5" rx="0.75"/>';

    // Vyzdvižená karta, která přesahuje okraj telefonu. Nese JEDEN fakt:

        return '<rect class="vyzdvih" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="3"/>' + obsah;
    }

    var S = O.w;      // šířka obrazovky — obsah se do ní musí vejít
    var SV = O.h;     // výška obrazovky

    // ------------------------------------------------------------------
    // ČTYŘI SCÉNY
    // ------------------------------------------------------------------
    var SCENY = {

        // 1) V TERÉNU: obrazovka = AR pohled (stavová pilulka, terén, značky,

        teren: telefon('' +
            // obloha a země pod ní
            '<path d="M0 0 H' + S + ' V' + (SV * 0.52) + ' Q' + (S * 0.55) + ' ' + (SV * 0.46) + ' 0 ' + (SV * 0.5) + ' Z" fill="url(#obloha)"/>' +

            '<rect class="ui" x="3" y="4.5" width="' + (S - 6) + '" height="6.4" rx="3.2"/>' +

            '  <tspan class="t-drobne" font-size="2.3">214,6°</tspan></text>' +

            '<g><line class="lin-tenka" x1="10" y1="' + (SV * 0.5) + '" x2="10" y2="' + (SV * 0.36) + '"/>' +
            '<circle class="lin" cx="10" cy="' + (SV * 0.335) + '" r="2.4"/>' +
            '<circle class="terc" cx="10" cy="' + (SV * 0.335) + '" r="1"/>' +

            '<rect class="ui" x="21" y="' + (SV * 0.245) + '" width="20.5" height="5.8" rx="2.9"/>' +

            '  <tspan class="cs-sep"> · </tspan>' +
            '  <tspan class="t-cislo" font-size="2.3">8,1 m</tspan></text></g>' +
            // spodní navádění
            '<rect class="ui" x="3" y="' + (SV - 16) + '" width="' + (S - 6) + '" height="11" rx="3.5"/>' +
            '<g transform="translate(9.5 ' + (SV - 10.5) + ')">' +
            '  <circle class="lin" cx="0" cy="0" r="4" opacity="0.4"/>' +

            '</g>' +

            '<text class="t-stitek" x="16" y="' + (SV - 6.2) + '">DO BODU 4002</text>'
        ) +
            karta(2, 20, 34, 11,
                '<text class="t-stitek" x="5" y="25">BODOVÉ POLE ČÚZK</text>' +
                '<text class="t-nadpis" x="5" y="29.2">128 bodů v okolí</text>') +
            karta(74, 74, 34, 11,
                '<text class="t-stitek" x="77" y="79">SEVER SROVNÁN</text>' +

        // 2) PODKLADY: obrazovka = mapa s parcelami. Karty = přepínač vrstev

        podklady: telefon('' +
            '<rect x="0" y="0" width="' + S + '" height="' + SV + '" fill="#0e141a"/>' +
            '<polygon class="plocha" points="2,18 16,14 20,30 5,35"/>' +
            '<polygon class="plocha" points="16,14 34,10 38,26 20,30" opacity="0.62"/>' +
            '<polygon class="plocha" points="5,35 20,30 24,48 8,53"/>' +
            '<polygon class="plocha" points="20,30 38,26 41,44 24,48" opacity="0.5"/>' +

            '<text class="t-cislo" x="10" y="43" font-size="2.1">423/2</text>' +

            // moje poloha
            '<circle cx="21" cy="' + (SV * 0.56) + '" r="5.5" fill="rgba(47,158,116,0.16)"/>' +

            // měřítko dole
            '<line class="lin-tenka" x1="4" y1="' + (SV - 7) + '" x2="16" y2="' + (SV - 7) + '"/>' +
            '<line class="lin-tenka" x1="4" y1="' + (SV - 8.6) + '" x2="4" y2="' + (SV - 5.4) + '"/>' +
            '<line class="lin-tenka" x1="16" y1="' + (SV - 8.6) + '" x2="16" y2="' + (SV - 5.4) + '"/>' +
            '<text class="t-drobne" x="18" y="' + (SV - 6.2) + '" font-size="1.9">50 m</text>' +
            // tlačítko vrstev
            '<rect class="ui" x="' + (S - 10) + '" y="4.5" width="7" height="7" rx="2"/>' +

            '  <path d="M-9 0 L0 -6 L9 0 L0 6 Z"/><path d="M-9 6 L0 12 L9 6"/></g>'
        ) +
            karta(2, 14, 33, 25,
                '<text class="t-stitek" x="5" y="19">VRSTVY</text>' +
                '<rect x="5" y="21" width="27" height="4.6" rx="1.6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="0.4"/>' +
                '<text class="t-drobne" x="7.4" y="24.4">ortofoto</text>' +
                '<rect x="5" y="26.6" width="27" height="4.6" rx="1.6" fill="rgba(47,158,116,0.18)" stroke="#3eb487" stroke-width="0.5"/>' +
                '<text class="t-drobne" x="7.4" y="30" fill="#3eb487">katastr KN</text>' +
                '<rect x="5" y="32.2" width="27" height="4.6" rx="1.6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="0.4"/>' +
                '<text class="t-drobne" x="7.4" y="35.6">základní mapa</text>') +
            karta(74, 78, 34, 13,
                '<g class="lin" transform="translate(80 84.5) scale(0.22)" stroke-width="5">' +
                '  <path d="M-8 4 a6 6 0 0 1 1-11 a8 8 0 0 1 15 2 a5 5 0 0 1 0 9 Z"/><path d="M-12 -12 L12 12"/></g>' +
                '<text class="t-stitek" x="85" y="83">STAŽENO</text>' +
                '<text class="t-nadpis" x="85" y="87.4">12 km² offline</text>'),

        // 3) MĚŘENÍ A VÝPOČTY: obrazovka = terč vytyčení s odchylkou.
        //    Karty = výměra parcely a stav GPS.
        vypocty: telefon('' +
            '<rect class="ui" x="3" y="4.5" width="' + (S - 6) + '" height="6.4" rx="3.2"/>' +
            '<text class="t-drobne" x="6" y="8.6">Vytyčení bodu' +
            '  <tspan class="cs-sep"> · </tspan>' +
            '  <tspan class="t-akcent" font-size="2.4">4002</tspan></text>' +
            // terč
            '<g transform="translate(' + (S / 2) + ' ' + (SV * 0.42) + ')">' +
            '  <circle class="lin" cx="0" cy="0" r="17" opacity="0.14"/>' +
            '  <circle class="lin" cx="0" cy="0" r="11" opacity="0.3"/>' +
            '  <circle class="lin" cx="0" cy="0" r="5.5" opacity="0.5"/>' +
            '  <g class="lin" opacity="0.4"><path d="M0 -20v4M0 16v4M-20 0h4M16 0h4"/></g>' +
            '  <circle class="terc" cx="0" cy="0" r="1.3"/>' +
            '  <line class="lin-prerus" x1="0" y1="0" x2="6" y2="-4"/>' +
            '  <circle cx="6" cy="-4" r="2.6" fill="rgba(230,189,118,0.25)" stroke="#e6bd76" stroke-width="0.9"/>' +
            '  <circle class="zlata" cx="6" cy="-4" r="0.9"/>' +
            '</g>' +
            // odchylka
            '<rect class="ui" x="3" y="' + (SV * 0.68) + '" width="' + (S - 6) + '" height="12" rx="3.5"/>' +
            '<text class="t-stitek" x="6" y="' + (SV * 0.68 + 4.4) + '">ODCHYLKA</text>' +
            '<text class="t-velke" x="6" y="' + (SV * 0.68 + 9.6) + '">0,03 m' +
            '  <tspan class="t-drobne" font-size="2.3">  k severu</tspan></text>' +
            // protokol
            '<rect class="ui" x="3" y="' + (SV - 13) + '" width="' + (S - 6) + '" height="8" rx="2.6"/>' +
            '<text class="t-drobne" x="6" y="' + (SV - 7.6) + '">Protokol vytyčení' +
            '  <tspan class="cs-sep"> · </tspan>' +
            '  <tspan class="t-akcent" font-size="2.1">PDF</tspan></text>'
        ) +
            karta(2, 16, 34, 13,
                '<text class="t-stitek" x="5" y="21">VÝMĚRA PARCELY</text>' +
                '<text class="t-velke" x="5" y="26.4" font-size="4">1 042 m²</text>') +
            karta(74, 71, 34, 17,
                '<text class="t-stitek" x="77" y="76.5">STAV GPS</text>' +
                '<circle cx="78.6" cy="81.2" r="1.5" fill="#34d399"/>' +
                '<text class="t-akcent" x="81.6" y="82.1">± 0,8 m</text>' +
                '<text class="t-drobne" x="77" y="86.4" font-size="1.9">12 družic · dá se měřit</text>'),

        // 4) PO MĚŘENÍ: obrazovka = seznam bodů zakázky. Karty = formáty
        //    exportu a tým, který na zakázce dělá.
        kancelar: telefon('' +
            '<rect class="ui" x="3" y="4.5" width="' + (S - 6) + '" height="8" rx="2.6"/>' +
            '<text class="t-nadpis" x="6" y="8.4" font-size="2.4">Rekonstrukce III/3084</text>' +
            '<text class="t-drobne" x="6" y="11.4" font-size="1.9">128 bodů · S-JTSK / Bpv</text>' +
            (function () {
                var r = '', i, y;
                var body = [['4001', 'Mezník', '±0,8'], ['4002', 'Roh budovy', '±0,6'],
                            ['4003', 'Šachta', '±1,1'], ['4004', 'Obruba', '±0,7'],
                            ['4005', 'Sloup VN', '±0,9']];
                for (i = 0; i < body.length; i++) {
                    y = 16.5 + i * 9;
                    r += '<rect class="ui" x="3" y="' + y + '" width="' + (S - 6) + '" height="7.6" rx="2.2"/>' +
                         '<text class="t-akcent" x="6" y="' + (y + 4.9) + '" font-size="2.3">' + body[i][0] + '</text>' +
                         '<text class="t-drobne" x="14" y="' + (y + 4.9) + '" font-size="2.1">' + body[i][1] + '</text>' +
                         '<text class="t-cislo" x="' + (S - 9.5) + '" y="' + (y + 4.9) + '" font-size="2.1">' + body[i][2] + '</text>';
                }
                return r;
            })() +
            '<rect x="3" y="' + (SV - 13) + '" width="' + (S - 6) + '" height="8.5" rx="2.8" fill="rgba(47,158,116,0.2)" stroke="#3eb487" stroke-width="0.6"/>' +
            '<text class="t-nadpis" x="' + (S / 2) + '" y="' + (SV - 7.3) + '" text-anchor="middle" fill="#3eb487" font-size="2.4">Exportovat zakázku</text>'
        ) +
            karta(2, 18, 33, 22,
                '<text class="t-stitek" x="5" y="23">EXPORT</text>' +
                '<rect x="5" y="25" width="27" height="4.4" rx="2.2" fill="rgba(47,158,116,0.16)" stroke="#3eb487" stroke-width="0.4"/>' +
                '<text class="t-drobne" x="7.4" y="28.2" fill="#3eb487">CSV — souřadnice</text>' +
                '<rect x="5" y="30.4" width="27" height="4.4" rx="2.2" fill="rgba(47,158,116,0.16)" stroke="#3eb487" stroke-width="0.4"/>' +
                '<text class="t-drobne" x="7.4" y="33.6" fill="#3eb487">DXF — výkres</text>' +
                '<rect x="5" y="35.8" width="27" height="4.4" rx="2.2" fill="rgba(47,158,116,0.16)" stroke="#3eb487" stroke-width="0.4"/>' +
                '<text class="t-drobne" x="7.4" y="39" fill="#3eb487">PDF — protokol</text>') +
            karta(74, 70, 34, 20,
                '<text class="t-stitek" x="77" y="75">SDÍLENÁ ZAKÁZKA</text>' +
                '<circle cx="81" cy="81" r="3.6" fill="rgba(47,158,116,0.22)" stroke="#3eb487" stroke-width="0.6"/>' +
                '<text class="t-nadpis" x="81" y="81.9" text-anchor="middle" font-size="2.1">ŠV</text>' +
                '<circle cx="89" cy="81" r="3.6" fill="rgba(230,189,118,0.2)" stroke="#e6bd76" stroke-width="0.6"/>' +
                '<text class="t-nadpis" x="89" y="81.9" text-anchor="middle" font-size="2.1">PN</text>' +
                '<circle cx="97" cy="81" r="3.6" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.42)" stroke-width="0.6"/>' +
                '<text class="t-nadpis" x="97" y="81.9" text-anchor="middle" font-size="2.1">JD</text>' +
                '<text class="t-drobne" x="77" y="88" font-size="1.9">admin · měření · vedení</text>')
    };

    // přechody, které scény používají (jedny pro všechny panely)
    var DEFS = '<defs>' +
        // ⚠⚠ OŘEZ SE POČÍTÁ V SOUŘADNICÍCH OŘEZÁVANÉHO PRVKU, TEDY UŽ PO JEHO
        //    `transform`. Napoprvé tu byl obdélník na absolutní pozici obrazovky
        //    (O.x, O.y) — jenže skupina, na kterou se váže, je sama posunutá
        //    o totéž, takže se ořez posunul dvakrát a z obrazovky zbyl proužek
        //    u pravého okraje. Proto 0,0 a jen rozměr obrazovky.
        '<clipPath id="displej">' +
        '  <rect x="0" y="0" width="' + O.w + '" height="' + O.h + '" rx="' + O.r + '"/>' +
        '</clipPath>' +
        '<radialGradient id="zare" cx="50%" cy="42%" r="50%">' +
        '  <stop offset="0" stop-color="#3eb487" stop-opacity="0.26"/>' +
        '  <stop offset="0.55" stop-color="#3eb487" stop-opacity="0.07"/>' +
        '  <stop offset="1" stop-color="#3eb487" stop-opacity="0"/>' +
        '</radialGradient>' +
        '<linearGradient id="obloha" x1="0" y1="0" x2="0" y2="1">' +
        '  <stop offset="0" stop-color="#16202a"/><stop offset="1" stop-color="#0f171e"/>' +
        '</linearGradient>' +
        '</defs>';

    function panel(d, i, typ) {
        var el = document.createElement('div');
        el.className = 'panel ' + typ;

        el.setAttribute('data-w', 1080);
        el.setAttribute('data-h', 1920);
        el.innerHTML =
            '<div class="head">' +
            '  <div class="kicker">' + SIT + d.kicker + '</div>' +
            '  <h1>' + d.h1 + '</h1>' +

            '</div>' +
            '<div class="art">' +
            '  <svg viewBox="0 0 110 112" preserveAspectRatio="xMidYMid meet">' + DEFS + (SCENY[d.art] || '') + '</svg>' +
            '</div>' +
            '<div class="vyhody">' +
            d.vyhody.map(function (v) { return '<div>' + FAJFKA + '<span>' + v + '</span></div>'; }).join('') +

            '<div class="foot">' +
            '  <div class="ico">' + IKONA.replace(/width="172" height="172"/, 'width="100%" height="100%"') + '</div>' +

        return el;
    }

    var body = document.body;
    TYPY.forEach(function (typ) {
        var st = document.createElement('div');
        st.className = 'stitek';
        st.textContent = 'Google Play — telefon, 1080 × 1920';
        body.appendChild(st);
        data.forEach(function (d, i) { body.appendChild(panel(d, i, typ)); });
    });
})();
