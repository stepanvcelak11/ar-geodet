<!--
  ===== PROPAGAČNÍ OBRÁZKY PRO GOOGLE PLAY =====================================
  Tahle stránka NENÍ součást appky. Je to PŘEDLOHA, ze které skript
  `scripts/gen_promo.py` vyrenderuje hotové PNG v přesných rozměrech obchodu:

      play/promo/feature.png     1024 ×  500   „feature graphic" (povinný banner)
      play/promo/play-1..4.png   1080 × 1920   screenshoty telefonu

  ⚠⚠ ŽÁDNÉ MÍSTO NA FOTKU. Do 31. 8. 2026 měl každý panel prázdný rámeček, kam
  si měl uživatel vložit vlastní snímek z terénu. Na přání se to zahodilo:
  panely mají být SAMY O SOBĚ HOTOVÉ — informační leták propagačním způsobem,
  který říká, co appka umí a na co se hodí, a nečeká na nic dalšího.
  Místo fotky je proto v každém panelu KRESLENÁ SCÉNA (inline SVG), kreslená
  čárou ve stejné řeči jako ikona appky (kulaté konce, smaragdový akcent) —
  ne stínky a ne fotorealismus.

  ⚠⚠ ČTYŘI PANELY, NE OSM, A JEN PRO ANDROID (na přání 31. 8. 2026: „udělej
  jich méně, jen pro Android, a na každou fotku klidně více věcí"). Osm panelů
  po jedné vlastnosti nikdo v obchodě nedolistuje; čtyři hutné projde. Každý
  proto spojuje CELOU OBLAST a jeho scéna má víc dílů:
      1  terén        AR značky + navádění šipkou
      2  podklady     parcely katastru + vrstvy mapy + odznak offline
      3  výpočty      terč vytyčení s odchylkou + výměra parcely + přesnost
      4  po měření    seznam souřadnic + formáty exportu + tým firmy
  ⚠ VARIANTA PRO APP STORE (ios-*.png, 1290 × 2796) JE PRYČ. Kdyby se vracela,
    stačí do `TYPY` níž přidat zpátky `ios` a do CSS `.panel.ios` — layout je
    v jednotkách --u (1 % šířky), takže se přizpůsobí sám. A pozor: staré
    ios-*.png ze složky play/promo/ je pak potřeba smazat ručně, generátor
    maže jen to, co zrovna vyrábí.

  ⚠ Popisky ve scénách (čísla parcel, vzdálenosti, souřadnice, výměry) jsou
  VYMYŠLENÉ, ale realistické — jsou to ukázky, ne data. Kdyby se měnily, musí
  zůstat věrohodné pro geodeta: parcelní čísla ve tvaru 421/7, metry
  s desetinnou ČÁRKOU, souřadnice v S-JTSK (sedm míst před čárkou).

  Rozměry sedí až z generátoru (ten každý panel vyfotí zvlášť a přesně na
  pixel); ručně v prohlížeči jde stránka jen prohlédnout.
  =============================================================================
-->
<style>
    :root {
        --bg0: #1c222a;
        --bg1: #0c1014;
        --accent: #2f9e74;
        --accent-bright: #3eb487;
        --accent-soft: rgba(47, 158, 116, 0.14);
        --accent-line: rgba(47, 158, 116, 0.42);
        --text: #eceef2;
        --muted: #9aa1ac;
        --gold: #e6bd76;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        background: #05070a;
        font-family: "Segoe UI", "Inter", system-ui, -apple-system, sans-serif;
        color: var(--text);
        padding: 40px;
        display: flex;
        flex-wrap: wrap;
        gap: 40px;
        align-items: flex-start;
    }

    /* ---- panel obchodu ---------------------------------------------------
       Všechno uvnitř je v jednotce --u (1 % šířky), ne v pixelech. Kdyby se
       vracela druhá velikost (App Store), stačí přidat třídu s jiným --w/--h
       a layout se přizpůsobí sám. */
    .panel {
        width: var(--w);
        height: var(--h);
        --u: calc(var(--w) / 100);
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        background:
            radial-gradient(120% 70% at 50% -10%, rgba(47, 158, 116, 0.20) 0%, rgba(47, 158, 116, 0) 60%),
            linear-gradient(160deg, var(--bg0) 0%, var(--bg1) 100%);
        flex: 0 0 auto;
    }
    .panel.play { --w: 1080px; --h: 1920px; }

    /* jemná síť na pozadí — geodetický „papír", ne dekorace pro dekoraci */
    .panel::before {
        content: "";
        position: absolute; inset: 0;
        background-image:
            linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        background-size: calc(var(--u) * 8) calc(var(--u) * 8);
        pointer-events: none;
    }

    .head {
        position: relative;
        padding: calc(var(--u) * 7) calc(var(--u) * 7) 0;
        flex: 0 0 auto;
    }
    .kicker {
        display: inline-flex;
        align-items: center;
        gap: calc(var(--u) * 1.4);
        padding: calc(var(--u) * 1.1) calc(var(--u) * 2.4);
        border-radius: 999px;
        border: 1px solid var(--accent-line);
        background: var(--accent-soft);
        color: var(--accent-bright);
        font-size: calc(var(--u) * 2.35);
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: calc(var(--u) * 3);
    }
    .kicker svg { width: calc(var(--u) * 3); height: calc(var(--u) * 3); }
    h1 {
        font-size: calc(var(--u) * 6.4);
        line-height: 1.1;
        font-weight: 800;
        letter-spacing: -0.02em;
    }
    h1 em { color: var(--accent-bright); font-style: normal; }
    .sub {
        margin-top: calc(var(--u) * 2);
        font-size: calc(var(--u) * 3);
        line-height: 1.4;
        color: var(--muted);
        max-width: 94%;
    }

    /* ---- kreslená scéna -------------------------------------------------- */
    .art {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        margin: calc(var(--u) * 3) calc(var(--u) * 6) calc(var(--u) * 2);
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .art svg { width: 100%; height: 100%; overflow: visible; }

    /* společná řeč čar ve scénách */
    .art .lin { fill: none; stroke: var(--accent-bright); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .art .lin-tenka { fill: none; stroke: rgba(255, 255, 255, 0.30); stroke-width: 0.9; stroke-linecap: round; stroke-linejoin: round; }
    .art .lin-prerus { fill: none; stroke: rgba(255, 255, 255, 0.34); stroke-width: 0.9; stroke-dasharray: 2.6 2.2; stroke-linecap: round; }
    .art .plocha { fill: rgba(47, 158, 116, 0.13); stroke: var(--accent-bright); stroke-width: 1.3; stroke-linejoin: round; }
    .art .karta { fill: rgba(255, 255, 255, 0.05); stroke: rgba(255, 255, 255, 0.16); stroke-width: 0.9; }
    .art .terc { fill: var(--accent-bright); }
    .art .zlata { fill: var(--gold); }
    .art text { font-family: "Segoe UI", system-ui, sans-serif; }
    .art .t-popis { fill: var(--text); font-size: 3.2px; font-weight: 700; }
    .art .t-cislo { fill: var(--gold); font-size: 3.2px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .art .t-mala { fill: var(--muted); font-size: 2.6px; font-weight: 600; }
    /* ⚠ VLASTNÍ, MENŠÍ ŘEZ PRO TABULKU SOUŘADNIC. S obecným .t-cislo se sloupce
       X a Z do karty nevešly a PŘEKRÝVALY se — souřadnice v S-JTSK mají sedm
       míst před desetinnou čárkou, takže je to nejširší text v celé předloze.
       Když se bude tabulka měnit, PŘEPOČÍTAT šířku sloupců. */
    .art .t-tab { fill: var(--gold); font-size: 2.7px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .art .t-tab-h { fill: var(--muted); font-size: 2.3px; font-weight: 700; letter-spacing: 0.04em; }
    .art .t-velka { fill: var(--text); font-size: 6.4px; font-weight: 800; font-variant-numeric: tabular-nums; }

    /* ---- výhody ----------------------------------------------------------- */
    .vyhody {
        position: relative;
        flex: 0 0 auto;
        padding: 0 calc(var(--u) * 7);
        display: flex;
        flex-direction: column;
        gap: calc(var(--u) * 1.7);
    }
    .vyhody div {
        display: flex;
        align-items: flex-start;
        gap: calc(var(--u) * 1.9);
        font-size: calc(var(--u) * 2.85);
        line-height: 1.33;
        color: var(--text);
    }
    .vyhody svg {
        width: calc(var(--u) * 3.2);
        height: calc(var(--u) * 3.2);
        flex: 0 0 auto;
        margin-top: calc(var(--u) * 0.3);
        color: var(--accent-bright);
    }

    /* ---- patička se jménem appky ---------------------------------------- */
    .foot {
        position: relative;
        flex: 0 0 auto;
        padding: calc(var(--u) * 4.5) calc(var(--u) * 7) calc(var(--u) * 5.5);
        display: flex;
        align-items: center;
        gap: calc(var(--u) * 2);
    }
    .foot .ico { width: calc(var(--u) * 6.4); height: calc(var(--u) * 6.4); flex: 0 0 auto; }
    .foot .nm { font-size: calc(var(--u) * 3.4); font-weight: 800; letter-spacing: -0.01em; }
    .foot .nm span { color: var(--accent-bright); }
    .foot .cl { margin-left: auto; font-size: calc(var(--u) * 2.4); color: var(--muted); text-align: right; }

    /* ---- feature graphic 1024x500 --------------------------------------- */
    .feature {
        width: 1024px; height: 500px;
        --u: 10.24px;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        gap: 44px;
        padding: 0 64px;
        background:
            radial-gradient(90% 140% at 12% 50%, rgba(47, 158, 116, 0.26) 0%, rgba(47, 158, 116, 0) 62%),
            linear-gradient(120deg, var(--bg0) 0%, var(--bg1) 100%);
        flex: 0 0 auto;
    }
    .feature::before {
        content: "";
        position: absolute; inset: 0;
        background-image:
            linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
        background-size: 40px 40px;
    }
    .feature .ico { width: 168px; height: 168px; flex: 0 0 auto; position: relative; }
    .feature .tx { position: relative; }
    .feature h2 { font-size: 62px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.05; }
    .feature h2 span { color: var(--accent-bright); }
    .feature p { margin-top: 16px; font-size: 25px; line-height: 1.4; color: var(--muted); max-width: 640px; }
    .feature .chips { margin-top: 22px; display: flex; gap: 10px; flex-wrap: wrap; }
    .feature .chips b {
        font-size: 19px; font-weight: 700; padding: 7px 15px; border-radius: 999px;
        border: 1px solid var(--accent-line); background: var(--accent-soft); color: var(--accent-bright);
    }

    /* popisek nad každým panelem — do PNG se nedostane, je jen pro prohlížení */
    .stitek { width: 100%; font-size: 15px; color: #8b93a1; font-family: ui-monospace, monospace; }
</style>
</head>
