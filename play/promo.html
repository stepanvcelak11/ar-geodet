<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>AR Geodet — propagační obrázky do obchodů</title>
<!--
  ===== PROPAGAČNÍ OBRÁZKY PRO GOOGLE PLAY A APP STORE =========================
  Tahle stránka NENÍ součást appky. Je to PŘEDLOHA, ze které skript
  `scripts/gen_promo.py` vyrenderuje hotové PNG v přesných rozměrech obchodů:

      play/promo/feature.png       1024 ×  500   (Google Play, „feature graphic")
      play/promo/play-1..8.png     1080 × 1920   (Google Play, telefon)
      play/promo/ios-1..8.png      1290 × 2796   (App Store, 6,7")

  ⚠⚠ ŽÁDNÉ MÍSTO NA FOTKU. Do 31. 8. 2026 měl každý panel prázdný rámeček, kam
  si měl uživatel vložit vlastní snímek z terénu. Na přání se to zahodilo:
  panely mají být SAMY O SOBĚ HOTOVÉ — informační leták propagačním způsobem,
  který říká, co appka umí a na co se hodí, a nečeká na nic dalšího.
  Místo fotky je proto v každém panelu KRESLENÁ SCÉNA (inline SVG), která tu
  jednu věc ukazuje: AR značky nad terénem, šipka navádění, parcely katastru,
  terč vytyčení, kóty a výměra, semafor přesnosti, seznam souřadnic, tým.
  Kreslí se čárou ve stejné řeči jako ikona appky (stroke 2, kulaté konce,
  smaragdový akcent) — ne stínky a ne fotorealismus.

  ⚠ SVG NEMÁ ŽÁDNÝ TEXT, KTERÝ BY BYL POTŘEBA ČÍST DVAKRÁT. Všechny popisky ve
  scénách (čísla parcel, vzdálenosti, výměry) jsou VYMYŠLENÉ, ale realistické —
  jsou to ukázky, ne data. Kdyby se měnily, musí zůstat věrohodné pro geodeta:
  parcelní čísla ve tvaru 421/7, vzdálenosti v metrech s desetinnou ČÁRKOU.

  Rozměry sedí až z generátoru (ten každý panel vyfotí zvlášť a přesně na pixel);
  ručně v prohlížeči jde stránka jen prohlédnout.
  =============================================================================
-->
<style>
    :root {
        --bg0: #1c222a;
        --bg1: #0c1014;
        --accent: #2f9e74;
        --accent-bright: #3eb487;
        --accent-soft: rgba(47, 158, 116, 0.14);
        --accent-line: rgba(47, 158, 116, 0.42);
        --text: #eceef2;
        --muted: #9aa1ac;
        --gold: #e6bd76;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        background: #05070a;
        font-family: "Segoe UI", "Inter", system-ui, -apple-system, sans-serif;
        color: var(--text);
        padding: 40px;
        display: flex;
        flex-wrap: wrap;
        gap: 40px;
        align-items: flex-start;
    }

    /* ---- společný panel obchodu -------------------------------------------
       Rozměr řídí --w/--h, které nastavuje třída .play / .ios. Všechno uvnitř
       je v jednotce --u (1 % šířky), takže obě velikosti vypadají stejně
       a nemusí se nic ladit dvakrát. */
    .panel {
        width: var(--w);
        height: var(--h);
        --u: calc(var(--w) / 100);
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        background:
            radial-gradient(120% 70% at 50% -10%, rgba(47, 158, 116, 0.20) 0%, rgba(47, 158, 116, 0) 60%),
            linear-gradient(160deg, var(--bg0) 0%, var(--bg1) 100%);
        flex: 0 0 auto;
    }
    .panel.play { --w: 1080px; --h: 1920px; }
    .panel.ios  { --w: 1290px; --h: 2796px; }

    /* jemná síť na pozadí — geodetický „papír", ne dekorace pro dekoraci */
    .panel::before {
        content: "";
        position: absolute; inset: 0;
        background-image:
            linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        background-size: calc(var(--u) * 8) calc(var(--u) * 8);
        pointer-events: none;
    }

    .head {
        position: relative;
        padding: calc(var(--u) * 8) calc(var(--u) * 7) 0;
        flex: 0 0 auto;
    }
    .kicker {
        display: inline-flex;
        align-items: center;
        gap: calc(var(--u) * 1.4);
        padding: calc(var(--u) * 1.1) calc(var(--u) * 2.4);
        border-radius: 999px;
        border: 1px solid var(--accent-line);
        background: var(--accent-soft);
        color: var(--accent-bright);
        font-size: calc(var(--u) * 2.35);
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: calc(var(--u) * 3.2);
    }
    .kicker svg { width: calc(var(--u) * 3); height: calc(var(--u) * 3); }
    h1 {
        font-size: calc(var(--u) * 6.6);
        line-height: 1.1;
        font-weight: 800;
        letter-spacing: -0.02em;
    }
    h1 em { color: var(--accent-bright); font-style: normal; }
    .sub {
        margin-top: calc(var(--u) * 2.2);
        font-size: calc(var(--u) * 3.1);
        line-height: 1.42;
        color: var(--muted);
        max-width: 88%;
    }

    /* ---- kreslená scéna --------------------------------------------------
       Zabírá místo, kde dřív býval prázdný rámeček na fotku. Roste a smršťuje
       se s panelem (flex: 1), takže na vyšším plátně App Storu je jen větší,
       ne posunutá. */
    .art {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        margin: calc(var(--u) * 4) calc(var(--u) * 7) calc(var(--u) * 3);
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .art svg { width: 100%; height: 100%; overflow: visible; }

    /* společná řeč čar ve scénách */
    .art .lin { fill: none; stroke: var(--accent-bright); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .art .lin-tenka { fill: none; stroke: rgba(255, 255, 255, 0.30); stroke-width: 0.9; stroke-linecap: round; stroke-linejoin: round; }
    .art .lin-prerus { fill: none; stroke: rgba(255, 255, 255, 0.34); stroke-width: 0.9; stroke-dasharray: 2.6 2.2; stroke-linecap: round; }
    .art .plocha { fill: rgba(47, 158, 116, 0.13); stroke: var(--accent-bright); stroke-width: 1.3; stroke-linejoin: round; }
    .art .karta { fill: rgba(255, 255, 255, 0.05); stroke: rgba(255, 255, 255, 0.16); stroke-width: 0.9; }
    .art .terc { fill: var(--accent-bright); }
    .art .zlata { fill: var(--gold); }
    .art text { font-family: "Segoe UI", system-ui, sans-serif; }
    .art .t-popis { fill: var(--text); font-size: 3.4px; font-weight: 700; }
    .art .t-cislo { fill: var(--gold); font-size: 3.4px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .art .t-mala { fill: var(--muted); font-size: 2.8px; font-weight: 600; }
    /* ⚠ VLASTNI, MENSI REZ PRO TABULKU SOURADNIC. S obecnym .t-cislo (3,4 px)
       se sloupce X a Z do karty nevesly a PREKRYVALY se — souradnice v S-JTSK
       maji sedm mist pred desetinnou carkou, takze je to nejsirsi text v cele
       predloze. Kdyz se bude tabulka menit, PREPOCITAT sirku sloupcu. */
    .art .t-tab { fill: var(--gold); font-size: 2.9px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .art .t-tab-h { fill: var(--muted); font-size: 2.5px; font-weight: 700; letter-spacing: 0.04em; }
    .art .t-velka { fill: var(--text); font-size: 7.2px; font-weight: 800; font-variant-numeric: tabular-nums; }

    /* ---- výhody ----------------------------------------------------------- */
    .vyhody {
        position: relative;
        flex: 0 0 auto;
        padding: 0 calc(var(--u) * 7);
        display: flex;
        flex-direction: column;
        gap: calc(var(--u) * 2);
    }
    .vyhody div {
        display: flex;
        align-items: flex-start;
        gap: calc(var(--u) * 2);
        font-size: calc(var(--u) * 3);
        line-height: 1.35;
        color: var(--text);
    }
    .vyhody svg {
        width: calc(var(--u) * 3.4);
        height: calc(var(--u) * 3.4);
        flex: 0 0 auto;
        margin-top: calc(var(--u) * 0.25);
        color: var(--accent-bright);
    }

    /* ---- patička se jménem appky ---------------------------------------- */
    .foot {
        position: relative;
        flex: 0 0 auto;
        padding: calc(var(--u) * 5) calc(var(--u) * 7) calc(var(--u) * 6);
        display: flex;
        align-items: center;
        gap: calc(var(--u) * 2);
    }
    .foot .ico { width: calc(var(--u) * 6.4); height: calc(var(--u) * 6.4); flex: 0 0 auto; }
    .foot .nm { font-size: calc(var(--u) * 3.4); font-weight: 800; letter-spacing: -0.01em; }
    .foot .nm span { color: var(--accent-bright); }
    .foot .cl { margin-left: auto; font-size: calc(var(--u) * 2.4); color: var(--muted); text-align: right; }

    /* ---- feature graphic 1024x500 --------------------------------------- */
    .feature {
        width: 1024px; height: 500px;
        --u: 10.24px;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        gap: 44px;
        padding: 0 64px;
        background:
            radial-gradient(90% 140% at 12% 50%, rgba(47, 158, 116, 0.26) 0%, rgba(47, 158, 116, 0) 62%),
            linear-gradient(120deg, var(--bg0) 0%, var(--bg1) 100%);
        flex: 0 0 auto;
    }
    .feature::before {
        content: "";
        position: absolute; inset: 0;
        background-image:
            linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
        background-size: 40px 40px;
    }
    .feature .ico { width: 168px; height: 168px; flex: 0 0 auto; position: relative; }
    .feature .tx { position: relative; }
    .feature h2 { font-size: 62px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.05; }
    .feature h2 span { color: var(--accent-bright); }
    .feature p { margin-top: 16px; font-size: 25px; line-height: 1.4; color: var(--muted); max-width: 640px; }
    .feature .chips { margin-top: 22px; display: flex; gap: 10px; flex-wrap: wrap; }
    .feature .chips b {
        font-size: 19px; font-weight: 700; padding: 7px 15px; border-radius: 999px;
        border: 1px solid var(--accent-line); background: var(--accent-soft); color: var(--accent-bright);
    }

    /* popisek nad každým panelem — do PNG se nedostane, je jen pro prohlížení */
    .stitek { width: 100%; font-size: 15px; color: #8b93a1; font-family: ui-monospace, monospace; }
</style>
</head>
