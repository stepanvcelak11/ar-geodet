<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>FS Test</title>
    <link rel="manifest" href="manifest-test.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FS Test">
    <link rel="apple-touch-icon" href="icon.svg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        /* v7 — ARCHITEKTURA "ROLOVACÍ DOKUMENT SE ZAMČENÝM SCROLLEM" (jako Deník
           pokroku): ŽÁDNÉ position:fixed na kořeni (fixní podstrom iOS ořezává na
           zmenšeném viewportu). Dokument je normální tok o plné výšce displeje
           (852; nastaví JS), body je position:relative (kotva pro absolute děti).
           Scroll drží JS na nule. Obsah by se pak měl malovat i do spodní zóny,
           kam fixed vrstvy nedosáhnou — jako obsah za lištou Safari. */
        html, body {
            color: #fff;
            font-family: -apple-system, system-ui, sans-serif;
            overscroll-behavior: none;
            touch-action: none;
        }
        body { position: relative; }
        /* ROZLIŠENÍ VRSTEV: zelená = jen podklad plátna (html pozadí se roztahuje na
           celý displej vždy); FIALOVÁ = skutečně vykreslené TĚLO stránky. Pokud je
           dole u hrany zelený (ne fialový) pás, iOS ořezává kreslení obsahu na
           zmenšený viewport a tělo tam nedosáhne. */
        html { background: #16a34a; }
        body { background: #7c3aed; }
        /* absolute (ne fixed): fixed podstrom iOS ořezává; absolute se kotví
           k <body> (relative) s plnou výškou displeje. */
        .edge {
            position: absolute;
            left: 0; right: 0;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            z-index: 10;
        }
        #edge-top    { top: 0;    background: #2563eb; }
        #edge-bottom { bottom: 0; background: #dc2626; }
        /* žlutá linka = kde končí bezpečná zóna (nad home indikátorem) */
        #safe-line {
            position: absolute;
            left: 0; right: 0;
            bottom: env(safe-area-inset-bottom, 0px);
            height: 3px;
            background: #facc15;
            z-index: 11;
        }
        #panel {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: min(92vw, 420px);
            background: rgba(0, 0, 0, 0.72);
            border-radius: 14px;
            padding: 16px;
            font-family: ui-monospace, Menlo, monospace;
            font-size: 14px;
            line-height: 1.7;
        }
        #panel b { color: #facc15; }
        #verdict {
            margin-top: 10px;
            padding: 10px;
            border-radius: 10px;
            font-family: -apple-system, system-ui, sans-serif;
            font-weight: 700;
            text-align: center;
        }
        #verdict.ok  { background: #16a34a; }
        #verdict.bad { background: #dc2626; }
        /* PRAVÍTKO u spodní hrany: podle toho, která čára je vidět, poznáme,
           kde iOS přestává kreslit obsah. Kotveno k tělu (852 px). */
        .mark {
            position: absolute;
            left: 0; right: 0;
            height: 6px;
            z-index: 12;
            font-size: 11px;
            font-weight: 700;
            line-height: 6px;
            padding-left: 6px;
        }
        #mark-cut  { bottom: 59px; background: #f97316; } /* oranžová = konec starého viewportu (793) */
        #mark-mid  { bottom: 30px; background: #06b6d4; } /* tyrkysová = 822 */
        #mark-low  { bottom: 4px;  background: #ffffff; color: #000; } /* bílá = 848 */
        /* RŮŽOVÁ sonda: posunutá transformací DO spodní zóny. Pokud je vidět růžová,
           transformované vrstvy ořezu unikají (→ cesta k opravě mapy v appce). */
        #probe-tr {
            position: absolute;
            left: 20%; right: 20%;
            bottom: 80px;
            height: 22px;
            background: #ec4899;
            transform: translateY(62px);
            z-index: 13;
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            line-height: 22px;
        }
        /* skrytý měřič safe-area (env() nejde číst přímo z JS) */
        #sa-probe {
            position: absolute;
            visibility: hidden;
            padding-top: env(safe-area-inset-top, 0px);
            padding-right: env(safe-area-inset-right, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            padding-left: env(safe-area-inset-left, 0px);
        }
    </style>
</head>
<body>
    <div id="edge-top" class="edge">▲ HORNÍ OKRAJ WEBU ▲</div>
    <div id="edge-bottom" class="edge">▼ SPODNÍ OKRAJ WEBU ▼</div>
    <div id="safe-line"></div>
    <div class="mark" id="mark-cut">▲ konec zmenšeného viewportu</div>
    <div class="mark" id="mark-mid"></div>
    <div class="mark" id="mark-low"></div>
    <div id="probe-tr">transform sonda</div>
    <div id="sa-probe"></div>

    <div id="panel">
        <div>verze testu: <b>7</b></div>
        <div>display-mode: <b id="d-mode">?</b></div>
        <div>navigator.standalone: <b id="d-standalone">?</b></div>
        <div>okno: <b id="d-inner">?</b></div>
        <div>displej: <b id="d-screen">?</b></div>
        <div>visualViewport: <b id="d-vv">?</b></div>
        <div>tělo stránky: <b id="d-body">?</b></div>
        <div>scroll: <b id="d-scroll">?</b></div>
        <div>safe-area t/r/b/l: <b id="d-safe">?</b></div>
        <div id="verdict">měřím…</div>
    </div>

    <script>
    (function () {
        function txt(id, v) { document.getElementById(id).textContent = v; }

        // v7: dokument v normálním toku o plné výšce displeje (bez fixed kořene),
        // scroll zamčený na nule. Prvky by se měly malovat i do spodní zóny,
        // kam fixní vrstvy nedosáhnou (chování jako obsah za lištou Safari).
        function fullHeight() {
            var land = window.matchMedia('(orientation: landscape)').matches;
            return land ? Math.min(screen.width, screen.height)
                        : Math.max(screen.width, screen.height);
        }
        function applyFix() {
            if (window.navigator.standalone !== true) return;
            var full = fullHeight();
            var gap = full - window.innerHeight;
            if (gap > 0 && gap <= 120) { // ne iPad Split View apod.
                document.documentElement.style.height = full + 'px';
                document.body.style.height = full + 'px';
            }
        }
        // zámek scrollu (dokument je o ~59 px vyšší než viewport → iOS by nechal rolovat)
        window.addEventListener('scroll', function () {
            if (window.scrollY !== 0) window.scrollTo(0, 0);
        }, { passive: true });

        function update() {
            applyFix();
            var mode = 'browser';
            ['fullscreen', 'standalone', 'minimal-ui'].forEach(function (m) {
                if (window.matchMedia('(display-mode: ' + m + ')').matches) mode = m;
            });
            txt('d-mode', mode);
            txt('d-standalone', String(window.navigator.standalone));
            txt('d-inner', window.innerWidth + ' × ' + window.innerHeight + ' px');
            txt('d-screen', screen.width + ' × ' + screen.height + ' px');
            txt('d-vv', window.visualViewport
                ? Math.round(window.visualViewport.width) + ' × ' + Math.round(window.visualViewport.height) + ' px'
                : 'není');
            txt('d-body', document.body.clientWidth + ' × ' + document.body.clientHeight + ' px');
            var se = document.scrollingElement || document.documentElement;
            txt('d-scroll', window.scrollY + ' px (max ' + Math.max(0, se.scrollHeight - window.innerHeight) + ')');

            var probe = getComputedStyle(document.getElementById('sa-probe'));
            txt('d-safe',
                parseInt(probe.paddingTop) + ' / ' + parseInt(probe.paddingRight) + ' / ' +
                parseInt(probe.paddingBottom) + ' / ' + parseInt(probe.paddingLeft) + ' px');

            // v7: rozhoduje OKO — je červený pruh (a bílá/tyrkysová čára pravítka)
            // vidět u fyzické spodní hrany? Čísla jen popisují stav.
            var full = fullHeight();
            var v = document.getElementById('verdict');
            if (mode === 'browser' && window.navigator.standalone !== true) {
                v.className = '';
                v.textContent = 'Běžím v prohlížeči — přidej mě na plochu a otevři z ikony.';
            } else {
                v.className = 'ok';
                v.textContent = 'v7 (rolovací dokument, zamčený scroll): rozhoduje OKO — je červený pruh dole na hraně a modrý nahoře pod hodinami?';
            }
        }
        update();
        window.addEventListener('resize', update);
        window.addEventListener('orientationchange', function () { setTimeout(update, 300); });
        setInterval(update, 1000);
    })();
    </script>
</body>
</html>
