<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR Geodet — testy geodetického jádra</title>
<!-- VÝVOJÁŘSKÁ STRÁNKA (není v sw.js ani v index.html — appka ji nenačítá).
     Otevři přes http (např. `python -m http.server`), ne přes file:// — fixtures
     se načítají fetchem a file:// to blokuje.

     Testy samotné jsou v tests/cases-geo.js a jsou SPOLEČNÉ s CI. Dřív měla tahle
     stránka vlastní kopii ~24 assertů s ručně opsanými referenčními hodnotami a
     vlastní kopii definice Křováka — tedy tři místa, která se musela držet v souladu
     ručně. Teď je tady jen zobrazení; čísla i definici řídí fixtures.

     Bez prohlížeče (a bez node) totéž spustí:  python scripts/run_js_tests.py -v
     Ten navíc kontroluje delegaci modulů na GeoCore a pořadí parametrů. -->
<style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 20px auto; max-width: 820px; padding: 0 12px; background: #10151d; color: #e5e7eb; }
    h1 { font-size: 18px; }
    .t { padding: 6px 10px; border-left: 4px solid #374151; margin: 4px 0; background: #171e29; border-radius: 0 6px 6px 0; }
    .ok { border-color: #34d399; }
    .fail { border-color: #ef4444; background: #2a1a1a; }
    .detail { opacity: 0.65; font-size: 12px; font-family: ui-monospace, monospace; }
    #sum { font-size: 16px; font-weight: 700; margin: 14px 0; }
    .note { font-size: 12px; opacity: 0.6; margin-top: 18px; border-top: 1px solid #263041; padding-top: 10px; }
</style>
</head>
<body>
<h1>AR Geodet — testy geodetického jádra (GeoCore)</h1>
<div id="sum">Spouštím…</div>
<div id="out"></div>
<div class="note">
    Referenční hodnoty pocházejí z autoritativního PROJ (pyproj) na totožném
    proj-stringu, jaký si appka nastavuje v <code>js/logika.js</code> — generuje je
    <code>scripts/gen_geo_fixtures.py</code> do <code>tests/fixtures/geo-sjtsk.json</code>.
</div>

<script src="js/lib/proj4-2.9.0.min.js"></script>
<script src="js/geo-core.js"></script>
<script src="tests/cases-geo.js"></script>
<script>
(function () {
    'use strict';
    var out = document.getElementById('out'), sum = document.getElementById('sum');

    function row(name, ok, detail) {
        var d = document.createElement('div');
        d.className = 't ' + (ok ? 'ok' : 'fail');
        d.innerHTML = (ok ? '✓ ' : '✗ ') + name + (detail ? '<div class="detail">' + detail + '</div>' : '');
        out.appendChild(d);
    }
    function finish(results) {
        var nFail = 0;
        results.forEach(function (r) { if (!r.ok) nFail++; row(r.name, r.ok, r.detail); });
        sum.textContent = nFail === 0
            ? ('✓ Všech ' + results.length + ' testů prošlo.')
            : ('✗ ' + nFail + ' z ' + results.length + ' testů SELHALO.');
        sum.style.color = nFail === 0 ? '#34d399' : '#ef4444';
    }
    function fail(msg) { sum.textContent = '✗ ' + msg; sum.style.color = '#ef4444'; }

    fetch('tests/fixtures/geo-sjtsk.json')
        .then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
        })
        .then(function (fx) {
            // Definice projekce se bere z fixtures, kam ji generátor vzal PŘÍMO
            // z js/logika.js. Není tu tedy žádná ručně opsaná kopie, která by mohla
            // odejít od skutečnosti.
            proj4.defs('EPSG:5514', fx.proj4);
            finish(AGGeoTests.run({ GeoCore: window.GeoCore, proj4: window.proj4, fixtures: fx }));
        })
        .catch(function (e) {
            fail('Nepodařilo se načíst tests/fixtures/geo-sjtsk.json (' + e.message + '). '
                + 'Spusť stránku přes http, ne file:// — např. `python -m http.server` '
                + 'v adresáři projektu a otevři http://localhost:8000/tests.html');
        });
})();
</script>
</body>
</html>
