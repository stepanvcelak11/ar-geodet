# Nasazení appky na GitHub Pages ZE ZABALENÉHO KÓDU.
#
# Proč: appka se při startu načítá 70 samostatnými <script> tagy (~1,8 MB JS) a
# po každém pushi se musí ručně bumpnout SHELL_CACHE v sw.js, jinak mobil drží
# starou verzi. Tenhle workflow z toho udělá jediný zminifikovaný soubor
# dist/app.<hash>.min.js — hash v názvu je cache-busting sám o sobě.
#
# ODLOŽENÉ NÁSTROJE SE NEBALÍ. V index.html zůstávají jako <script type="ag/lazy"
# data-src="…"> a stahuje si je js/lazy-load.js až po prvním obraze (nástroje
# z js/lazy-tools.js dokonce až na klepnutí na dlaždici). Kdyby spadly do
# bundlu, spustilo by se před prvním obrazem všech 4,5 MB — a s nimi i vzdálený
# vypínač modulů, cílené AGLazy.need() a data-css by přestaly dávat smysl.
#
# ZDROJE V REPU SE NEMĚNÍ. Přepis index.html (build.mjs --apply) i přegenerování
# sw.js se dějí jen v checkoutu tohoto běhu, nic se necommituje.
#
# BEZPEČNOSTNÍ POJISTKA: než se cokoli nasadí, pustí se nad ZABALENOU verzí
# smoke testy (tests/smoke.spec.mjs). Když appka po zabalení nenaběhne, deploy
# se nespustí a venku zůstane předchozí verze.
#
# ┌─ JEDNORÁZOVĚ, než to začne fungovat ────────────────────────────────────────┐
# │ GitHub → repo → Settings → Pages → Build and deployment → Source:          │
# │ přepnout z „Deploy from a branch" na „GitHub Actions".                     │
# │ Do té doby si tenhle workflow můžeš pustit ručně (Run workflow) — build     │
# │ i testy proběhnou, jen krok „deploy" selže na chybějícím nastavení.         │
# └─────────────────────────────────────────────────────────────────────────────┘
name: Nasazení na Pages (zabalený kód)

on:
  workflow_dispatch: {}
  # Nasazuje se samo z main. Krok „deploy" ale projde teprve tehdy, až bude
  # v Settings → Pages přepnutý Source na „GitHub Actions" (viz rámeček výše).
  # Do té doby se build i testy spustí, jen publikace selže — a venku zůstane
  # předchozí verze, takže se tím nic nerozbije.
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Zabalit a otestovat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Závislosti
        run: npm install --no-audit --no-fund

      # --require-node: tenhle workflow nasazuje do produkce, takže se kontrola
      # syntaxe nesmí tiše přeskočit, kdyby Node v runneru chyběl.
      # (esprima se tu už neinstaluje — check_js.py z mainu jede jen na stdlib.)
      - name: Statická kontrola JS
        run: python scripts/check_js.py --require-node

      # Prohlížeč se stahuje JEDNOU pro obě vydání — smoke testy běží dvakrát.
      - name: Prohlížeč pro smoke testy
        run: npx playwright install --with-deps chromium

      # ---- DVĚ VYDÁNÍ NA JEDNOM ORIGINU ---------------------------------------
      # Appka se prodává jako ZÁKLAD (zdarma) a PRO (placené) a nasazují se
      # jako DVA BALÍČKY, ne jeden s přepínačem: Základ tak nestahuje kód, který
      # nikdy nespustí.
      #
      # ⚠ PRO BYDLÍ POD /pro/ NA TÉMŽE ORIGINU. Není to kosmetika: localStorage
      #   i cache jsou per-origin, takže si geodet po koupi otevře druhý odkaz
      #   a má tam rovnou svoje zakázky, body i opsaný klíč. Samostatné nasazení
      #   by znamenalo zadávat klíč dvakrát a data stěhovat exportem.
      #
      # ⚠ POŘADÍ JE PRO NAPŘED. Sestavení Základu ze stromu MAŽE Pro moduly
      #   (scripts/vydani.py --zaklad --pred), takže po něm už není z čeho Pro
      #   postavit. Opačné pořadí by tiše vyrobilo dvě kopie Základu.
      - name: Sestavit vydání PRO (nasadí se do /pro/)
        run: |
          python scripts/vydani.py --pro --pred
          npm run build -- --apply
          python scripts/gen_sw_assets.py
          python scripts/vydani.py --pro --po

      # Obě vydání se testují ZVLÁŠŤ. Kdyby se pouštěl smoke jen nad Základem
      # (ten je rizikovější, mažou se v něm soubory), rozbité Pro by se nasadilo
      # bez povšimnutí — a platí ho ti, kteří si za appku zaplatili.
      - name: Smoke testy nad vydáním PRO
        run: npm run test:smoke

      - name: Odložit /pro/ stranou
        run: |
          mkdir -p _site/pro
          rsync -a --exclude '.git' --exclude '.github' --exclude 'node_modules' \
                   --exclude 'tests' --exclude 'playwright-report' --exclude 'test-results' \
                   --exclude '_site' --exclude 'scripts' --exclude 'cloud' \
                   --exclude '*.md' --exclude 'package.json' --exclude 'package-lock.json' \
                   --exclude 'playwright.config.mjs' \
                   --exclude '/play' --exclude '/garmin' --exclude '/_archiv' \
                   --exclude '/logo-navrhy' --exclude '/nahledy-*' --exclude '/navrhy-*' \
                   --exclude '/test-fullscreen*' --exclude '/manifest-test*' \
                   --exclude '/tests.html' \
                   ./ _site/pro/

      # Zdroje zpátky do původního stavu, ať Základ nestaví nad přepsaným
      # index.html. `git checkout` bere jen sledované soubory — dist/ se maže
      # zvlášť, jinak by v balíčku Základu zůstal bundle vyrobený z Pro kódu
      # (jméno má hash, takže by se ani nepřepsal, jen by tam ležel navíc).
      - name: Vrátit strom do stavu z checkoutu
        run: |
          git checkout -- index.html sw.js manifest.json
          rm -rf dist

      - name: Sestavit vydání ZÁKLAD (nasadí se na kořen)
        run: |
          python scripts/vydani.py --zaklad --pred
          npm run build -- --apply
          python scripts/gen_sw_assets.py
          python scripts/vydani.py --zaklad --po

      # Rozpočet startu se v release-check.yml měří nad ZDROJI, jenže uživatel
      # venku dostává tenhle balíček. Do 5. 9. 2026 to byly dvě různé appky:
      # build.mjs bral do bundlu i moduly s data-src, takže se v nasazené verzi
      # spouštělo před prvním obrazem VŠECHNO (4,5 MB zdrojů) a odkládací vrstva
      # byla mrtvá — proto tu krok visel jen informativně (continue-on-error).
      # Teď bundle obsahuje pouze eager moduly a odložené řádky zůstávají
      # v index.html, takže je z kroku BRÁNA: když se to zase rozejde, nasazení
      # se zastaví, místo aby se rozdíl tiše vydal do terénu.
      - name: Rozpočet startu ZABALENÉ verze
        run: python scripts/check_start_budget.py --dist

      - name: Smoke testy nad vydáním ZÁKLAD
        run: npm run test:smoke

      - name: Report z testů (i při chybě)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pages
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

      # Do nasazované kopie nepatří vývojářské věci. js/*.js se nasazují a MUSÍ
      # se nasazovat: v bundlu je jen eager jádro, kdežto odložené nástroje
      # (script type="ag/lazy") a nástroje s děleným načítáním (js/lazy-tools.js)
      # si prohlížeč stahuje po souborech až po prvním obraze / na klepnutí.
      #
      # Druhá skupina vyloučení (play, garmin, _archiv, logo-navrhy, nahledy-*,
      # navrhy-*, test-fullscreen*, manifest-test*, tests.html) jsou podklady pro
      # vývoj a pro Obchod Play — appka je nikdy nenačte, ale bez nich se
      # nasazovalo o 5,9 MB víc a hlavně: manifest-test*.json ležely veřejně
      # vedle ostrého manifest.json a test-fullscreen*.html na doméně appky, kde
      # na ně mohl narazit prohlížeč i vyhledávač.
      # VEDOUCÍ LOMÍTKO je schválně: rsync vzor bez lomítka se páruje na KAŽDÉ
      # úrovni stromu, takže 'play' by vyhodilo i budoucí js/play.
      - name: Připravit _site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'node_modules' \
                   --exclude 'tests' --exclude 'playwright-report' --exclude 'test-results' \
                   --exclude '_site' --exclude 'scripts' --exclude 'cloud' \
                   --exclude '*.md' --exclude 'package.json' --exclude 'package-lock.json' \
                   --exclude 'playwright.config.mjs' \
                   --exclude '/play' --exclude '/garmin' --exclude '/_archiv' \
                   --exclude '/logo-navrhy' --exclude '/nahledy-*' --exclude '/navrhy-*' \
                   --exclude '/test-fullscreen*' --exclude '/manifest-test*' \
                   --exclude '/tests.html' \
                   ./ _site/
          echo "Velikost nasazované kopie:"; du -sh _site _site/pro

      # POJISTKA PŘED PUBLIKACÍ. Kdyby se kroky nad tím přeuspořádaly (a bylo by
      # to lákavé — vypadají zaměnitelně), nasadila by se dvakrát táž appka a
      # nikdo by si toho nevšiml: obě vydání vypadají na první pohled stejně.
      # Značka vydání je jediné místo, kde se poznají.
      - name: Ověřit, že jsou to opravdu dvě různá vydání
        run: |
          grep -q "window.__AG_VYDANI = 'zaklad'" _site/index.html \
            || { echo "::error::_site/index.html není vydání ZÁKLAD"; exit 1; }
          grep -q "window.__AG_VYDANI = 'pro'" _site/pro/index.html \
            || { echo "::error::_site/pro/index.html není vydání PRO"; exit 1; }
          # Pro moduly v Základu být nesmí — kdyby tam zůstaly, prodává se něco,
          # co má každý už teď v balíčku.
          for f in $(python scripts/check_verze.py --mapa | python -c \
                     "import json,sys; print(' '.join(json.load(sys.stdin)['smazatelne']))"); do
            if [ -e "_site/$f" ]; then echo "::error::v Základu zůstal Pro modul $f"; exit 1; fi
            if [ ! -e "_site/pro/$f" ]; then echo "::error::v Pro chybí modul $f"; exit 1; fi
          done
          echo "OK — kořen je ZÁKLAD, /pro/ je PRO."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publikovat
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
