# Kontrola konzistence vydání: seznam ASSETS_TO_CACHE v sw.js + verze cache
# (SHELL_CACHE vNNN == ?v=NNN u css/tokens.css i css/style.css, a to jak v sw.js,
#  tak v <link> v index.html), a integrita kódu (syntaxe JS, duplicitní klíče,
#  duplicitní id, odkazy na neexistující soubory).
# Žádný deploy — jen validace.
name: Kontrola vydání (SW + verze + kód)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python 3 je na ubuntu-latest předinstalovaný, skripty používají jen stdlib.
      - name: Verze a seznam assetů (sw.js / index.html)
        run: python scripts/gen_sw_assets.py --check

      # Sebekontrola kontroloru: kdyby detekce duplicit přestala fungovat,
      # check_js.py by tiše hlásil OK. Tenhle test to odhalí.
      - name: Sebekontrola scripts/check_js.py
        run: python scripts/check_js_test.py

      # Node je na ubuntu-latest taky předinstalovaný → check_js.py si ho najde
      # sám a projede `node --check` přes všechny skripty. Na vývojářském stroji
      # Node není, tam se ta část jen přeskočí.
      # --require-node: kdyby Node v runneru chyběl, kontrola syntaxe by se tiše
      # přeskočila a CI by svítilo zeleně, aniž by cokoli ověřilo. S tímhle
      # přepínačem to místo toho spadne.
      - name: Integrita kódu (syntaxe, duplicitní klíče, chybějící soubory)
        run: python scripts/check_js.py --require-node

      # Každý nástroj musí mít v js/tools-registry.js záznam s kategorií, slovesem,
      # synonymy a návodem. Dřív to bylo rozepsané v šesti ručních tabulkách a nic
      # to nekontrolovalo — takže se opakovaně zapomnělo (Kompas nešel najít,
      # DronView neměl „?", 19 nástrojů se nedalo vyhledat).
      # --require-js: bez Node/V8 by kontrola tiše přeskočila a CI by lhalo.
      - name: Registr nástrojů je úplný
        run: python scripts/check_tools_registry.py --require-js

      # Rozpočet startu: kolik JS a CSS musí prohlížeč stáhnout a spustit JEŠTĚ
      # PŘED prvním vykreslením. Rostlo to tiše (každý nový modul o kus) až na
      # 2273 kB v 79 souborech; přesun devíti nástrojů do lazy vrstvy to srazil
      # na 1945 kB a první vykreslení z 892 na 588 ms. Bez téhle brány by to
      # narostlo zpátky a nikdo by si toho nevšiml — pomalý start se neprojeví
      # jako chyba, jen jako „appka se nějak dlouho otevírá".
      - name: Rozpočet startu (eager JS/CSS)
        run: python scripts/check_start_budget.py --check

      # Design tokeny a kontrast. Dvakrát už appku položila chyba, kterou nic
      # nechytlo: var(--text, #eee) na token, který NIKDY neexistoval (36x v 7
      # modulech → ve světlém režimu neviditelný text), a --accent-grad:var(--accent)
      # zapsané na :root, kde se přepis ve světlém režimu neprojevil.
      # Skript navíc počítá kontrast podle WCAG, takže .btn-primary už nemůže
      # tiše spadnout pod 4,5:1.
      - name: Tokeny a kontrast
        run: python scripts/check_css_tokens.py
