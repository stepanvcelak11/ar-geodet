# Kontrola konzistence vydání: seznam ASSETS_TO_CACHE v sw.js + verze cache
# (SHELL_CACHE vNNN == ?v=NNN u css/tokens.css i css/style.css, a to jak v sw.js,
#  tak v <link> v index.html), a integrita kódu (syntaxe JS, duplicitní klíče,
#  duplicitní id, odkazy na neexistující soubory).
# Žádný deploy — jen validace.
name: Kontrola vydání (SW + verze + kód)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — krok „Změna kódu vyžaduje bump SHELL_CACHE" potřebuje
      # sáhnout do PŘEDCHOZÍHO commitu (git show BASE:sw.js). S mělkým klonem
      # (výchozí depth 1) tam ten commit prostě není.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ZAPOMENUTÝ BUMP je nejzrádnější způsob, jak vydat rozbitou appku:
      # service worker servíruje js/*.js CACHE-FIRST (klíč = SHELL_CACHE), ale
      # index.html jede stale-while-revalidate. Když se pošle změna v kódu a
      # SHELL_CACHE zůstane stejný, prohlížeč nového SW vůbec nevidí (žádná lišta
      # „Nová verze"), zatímco index.html se mu na pozadí PŘESTO obnoví — geodet
      # tak dostane NOVÉ HTML se STARÝM JS. Přesně tímhle prošlo 11 z posledních
      # 40 commitů (např. 55c0626: z index.html zmizel #w-project-select a starý
      # js/grafika.js na něj dál sahal → výjimka v DOMContentLoaded shodila
      # i načtení bodů zakázky). Uživatel z toho nemá cestu ven, protože mu SW
      # novou verzi nikdy nenabídne.
      #
      # Proti čemu porovnávat: na push do main proti github.event.before (přesně
      # to, co se právě přidalo), na pull_request proti merge-base s main —
      # HEAD~1 by tu ukazoval na slučovací commit a hlásil nesmysly.
      - name: Změna kódu vyžaduje bump SHELL_CACHE
        run: |
          set -eu
          BASE=""
          if [ "${{ github.event_name }}" = "push" ]; then
            B="${{ github.event.before }}"
            if [ -n "$B" ] && git cat-file -e "$B^{commit}" 2>/dev/null; then BASE="$B"; fi
          fi
          if [ -z "$BASE" ]; then
            git fetch --quiet origin main 2>/dev/null || true
            BASE="$(git merge-base origin/main HEAD 2>/dev/null || true)"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "$(git rev-parse HEAD)" ]; then
            echo "Není s čím porovnat (BASE='$BASE') — kontrola se přeskakuje."
            exit 0
          fi
          echo "Porovnávám proti $BASE"
          ZMENY="$(git diff --name-only "$BASE" HEAD)"
          KOD="$(printf '%s\n' "$ZMENY" | grep -E '^(js/|css/|index\.html$)' || true)"
          if [ -z "$KOD" ]; then
            echo "Kód appky (js/, css/, index.html) se nezměnil — bump není potřeba."
            exit 0
          fi
          # || true u obou: bez nej by `set -e` shodilo krok uz na tom, ze grep
          # nic nenasel (napr. sw.js v BASE jeste neexistoval) — a chybova hlaska
          # by mluvila o necem uplne jinem, nez co se stalo.
          STARA="$(git show "$BASE:sw.js" 2>/dev/null | grep -oE 'argeodet-shell-v[0-9]+' | head -1 || true)"
          NOVA="$(grep -oE 'argeodet-shell-v[0-9]+' sw.js | head -1 || true)"
          echo "SHELL_CACHE: ${STARA:-?} -> ${NOVA:-?}"
          if [ -z "$STARA" ] || [ -z "$NOVA" ]; then
            echo "SHELL_CACHE se nepodarilo precist — kontrola se preskakuje."
            exit 0
          fi
          if [ "$STARA" = "$NOVA" ]; then
            echo "::error file=sw.js::Změnil se kód appky, ale SHELL_CACHE zůstal $NOVA."
            echo ""
            echo "Změněné soubory:"
            printf '%s\n' "$KOD" | sed 's/^/  /'
            echo ""
            echo "CO S TÍM: zvedni číslo v sw.js (SHELL_CACHE = 'argeodet-shell-vNNN')"
            echo "a stejné NNN dej do ?v= u css/tokens.css i css/style.css —"
            echo "nejjistěji:  python scripts/gen_sw_assets.py --bump"
            exit 1
          fi
          echo "OK — kód se změnil a verze je bumpnutá."

      # Python 3 je na ubuntu-latest předinstalovaný, skripty používají jen stdlib.
      - name: Verze a seznam assetů (sw.js / index.html)
        run: python scripts/gen_sw_assets.py --check

      # Sebekontrola kontroloru: kdyby detekce duplicit přestala fungovat,
      # check_js.py by tiše hlásil OK. Tenhle test to odhalí.
      - name: Sebekontrola scripts/check_js.py
        run: python scripts/check_js_test.py

      # Node je na ubuntu-latest taky předinstalovaný → check_js.py si ho najde
      # sám a projede `node --check` přes všechny skripty. Na vývojářském stroji
      # Node není, tam se ta část jen přeskočí.
      # --require-node: kdyby Node v runneru chyběl, kontrola syntaxe by se tiše
      # přeskočila a CI by svítilo zeleně, aniž by cokoli ověřilo. S tímhle
      # přepínačem to místo toho spadne.
      - name: Integrita kódu (syntaxe, duplicitní klíče, chybějící soubory)
        run: python scripts/check_js.py --require-node

      # Každý nástroj musí mít v js/tools-registry.js záznam s kategorií, slovesem,
      # synonymy a návodem. Dřív to bylo rozepsané v šesti ručních tabulkách a nic
      # to nekontrolovalo — takže se opakovaně zapomnělo (Kompas nešel najít,
      # DronView neměl „?", 19 nástrojů se nedalo vyhledat).
      # --require-js: bez Node/V8 by kontrola tiše přeskočila a CI by lhalo.
      - name: Registr nástrojů je úplný
        run: python scripts/check_tools_registry.py --require-js

      - name: Delici cara Zaklad/Pro (registr)
        run: python scripts/check_verze.py

      - name: Zaklad nesaha na Pro moduly
        run: python scripts/check_zaklad.py

      - name: Licence Pro (vyroba klice sedi s overenim)
        run: python scripts/test_licence.py

      # Delici cara se da rozbit tise a v OBOU smerech: bud z balicku Zakladu
      # vypadne soubor, na kterem stoji start, nebo naopak Pro kod v Zakladu
      # zustane a prodava se neco, co uz kazdy ma. Tady bezi jen staticka cast
      # (sestavi obe vydani do docasnych kopii a porovna je) - bez prohlizece,
      # aby release-check zustal rychly. Spusteni Zakladu hlida tests.yml.
      - name: Delene sestaveni (Zaklad vs Pro)
        run: python scripts/test_vydani.py --staticky

      # Rozpočet startu: kolik JS a CSS musí prohlížeč stáhnout a spustit JEŠTĚ
      # PŘED prvním vykreslením. Rostlo to tiše (každý nový modul o kus) až na
      # 2273 kB v 79 souborech; přesun devíti nástrojů do lazy vrstvy to srazil
      # na 1945 kB a první vykreslení z 892 na 588 ms. Bez téhle brány by to
      # narostlo zpátky a nikdo by si toho nevšiml — pomalý start se neprojeví
      # jako chyba, jen jako „appka se nějak dlouho otevírá".
      - name: Rozpočet startu (eager JS/CSS)
        run: python scripts/check_start_budget.py --check

      # Design tokeny a kontrast. Dvakrát už appku položila chyba, kterou nic
      # nechytlo: var(--text, #eee) na token, který NIKDY neexistoval (36x v 7
      # modulech → ve světlém režimu neviditelný text), a --accent-grad:var(--accent)
      # zapsané na :root, kde se přepis ve světlém režimu neprojevil.
      # Skript navíc počítá kontrast podle WCAG, takže .btn-primary už nemůže
      # tiše spadnout pod 4,5:1.
      - name: Tokeny a kontrast
        run: python scripts/check_css_tokens.py
