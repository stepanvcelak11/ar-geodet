name: Geo zpravodaj (denní vydání)

# Sestaví data/zpravodaj.json z RSS zdrojů přes GitHub Models a commitne ho.
# Spouští se každé ráno (cron, UTC) a jde spustit i ručně (Run workflow).
on:
  schedule:
    - cron: '30 5 * * *'   # 05:30 UTC ≈ 07:30 Praha (léto) / 06:30 (zima)
  workflow_dispatch: {}

permissions:
  contents: write   # aby bot mohl commitnout nové vydání
  # `models: read` už netřeba — GitHub Models je retired (HTTP 410), vydání se
  # skládá pravidlově z RSS. Podrobně v hlavičce scripts/build-zpravodaj.mjs.

concurrency:
  group: zpravodaj
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Prague
      # Posune obalové akce (checkout) na Node 24 → zmizí varování o deprecaci Node 20.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # plná historie kvůli rebase při souběžném pushi

      # Node je na ubuntu-latest předinstalovaný (v20+), skript používá jen vestavěné moduly.

      - name: Sestavit vydání
        env:
          # VOLITELNÉ a ve výchozím stavu PRÁZDNÉ: bez klíče se vydání složí
          # pravidlově z RSS — zdarma, bez jakéhokoli API. Kdo bude chtít zpět
          # české shrnutí cizojazyčných zpráv, přidá repo secret ANTHROPIC_API_KEY;
          # skript si ho vezme sám a při selhání API se tiše vrátí k pravidlům.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/build-zpravodaj.mjs

      - name: Commitnout, pokud se vydání změnilo
        run: |
          if git diff --quiet -- data/zpravodaj.json; then
            echo "Beze změny — necommituji."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/zpravodaj.json
          git commit -m "Zpravodaj: vydání $(date +%F) [skip ci]"
          # Robustní push: když mezitím někdo pushne na main, rebasni a zkus znovu.
          # (Bot sahá jen na data/zpravodaj.json, takže rebase je bezkonfliktní.)
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then echo "pushnuto"; exit 0; fi
            echo "push odmítnut (pokus $i) — stahuji origin/main a rebasuji…"
            git pull --rebase --autostash origin main || true
          done
          echo "push se nepodařil ani po opakování" >&2
          exit 1
